# intel-update: SEO skill 自更新 cron(信源变更 → agent 更新 skill → commit+push)
# ----------------------------------------------------------------------------
# 每日 UTC 01:11 跑一次。拉 18 个信源(intel_check.py)检测变更,
# 有变更 → 工单(本轮报告)写进 label=intel-update-pending 的 issue:无 open issue 则新开,
# 已有则追加评论(触发人工/agent 后续处理)。工单不再提交成仓根文件——运行态不入库。
# 无变更不自动关 issue:关单只由处理方在按协议处理完后执行,避免未处理的工单被静默关掉。
#
# 这是 self-update 循环的 CI 端:检测+标记自动;文件级更新由 agent(或你)
# 在收到通知后按 self-update-protocol.md 执行——P0 规则级自动改,
# P1 事实级自动改,行为性变更(评分权重/检查阈值)标 [HUMAN-REVIEW]。
#
# 状态持久化(审计③统一):intel 基线从 cache-only 改 commit-back——cache 停跑
# >7 天驱逐=基线静默重置(全部 RSS 源误报变更)。脚本 intel_check.py 无 --state
# 参数,STATE_FILE 硬编码为脚本相对路径 skills/seo-suite/.intel-state.json
# (.gitignore 排除,绝不 force-add)→ workflow 层桥接:check 后 copy-out 到
# .github/state/intel-state.json(未被 ignore 匹配)并 commit;权威=git,
# cache 步保留作加速/一次性迁移(脚本路径未变,旧 cache 自动续命)。
#
# 使用(两种方式):
#
# A. GitHub Actions(推荐,免费):
#   1. 把本文件拷到你的 seo-skills fork 的 .github/workflows/intel-update.yml
#   2. (可选)配 Secrets: SEO_INTEL_SLACK_WEBHOOK / SEO_INTEL_TG_TOKEN+
#      SEO_INTEL_TG_CHAT —— 变更时收通知,然后手动或 agent 处理
#   3. fork 即用,无需其他配置
#
# B. 本地 cron / launchd / Claude Code 定时(你在自己的机器上):
#   crontab -e 加一行(每天 09:11 本地):
#     11 9 * * * cd /path/to/seo-skills && python3 skills/seo-suite/scripts/intel_check.py check >> .intel-cron.log 2>&1 && [ $? -eq 1 ] && python3 skills/seo-suite/scripts/notify.py --alerts .seo-monitor/alerts.json
#   或用 Claude Code 的定时任务功能,发送指令模板:
#     "检查信源并更新 SEO skill:cd /path/to/seo-skills && python3
#      skills/seo-suite/scripts/intel_check.py check → 有变更按
#      skills/seo-suite/references/overview/self-update-protocol.md 处理 →
#      self_check 全绿 → git commit + push → 中文总结"
#
# C. Codex 定时(同理):
#   用系统 cron 调 codex exec 或 claude -p 无头执行上述指令模板,
#   prompt 里必须写明成功标准(无头模式无人可追问):
#     成功标准 = intel_check 退出码为 0 或已完成全部更新且 self_check 通过
#     失败标准 = fetch_error 超过 5 个源或 self_check FAIL
#
# ----------------------------------------------------------------------------

name: intel-update
on:
  schedule:
    - cron: '11 1 * * *'  # 每日 UTC 01:11(非整点减撞车)
  workflow_dispatch: {}     # 手动触发按钮

permissions:
  contents: write
  issues: write

concurrency:
  group: intel-update
  cancel-in-progress: false

jobs:
  check-and-flag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # cache 仅加速(权威=git 的 .github/state/intel-state.json);路径=脚本
      # STATE_FILE 原生位置,故它同时是旧 cache 的一次性迁移源,无需额外 shim
      - name: Restore intel state (cache 加速/迁移;权威=git)
        uses: actions/cache@v4
        with:
          path: skills/seo-suite/.intel-state.json
          key: intel-state-${{ github.run_id }}
          restore-keys: intel-state-

      # 只 check 一次:报告落 $RUNNER_TEMP,工单直接复用。此前生成工单时再跑一次 check,
      # 第二次比对的是第一次刚存下的基线 → 工单头部写"有变更"、正文恒为"无变更"
      # (10-13/10-14/10-15 复现)。退出码:0=无变更 / 1 且有 [CHANGED] 行=有变更 /
      # 其余(参数错、未捕获异常也是 1 但无 [CHANGED])=error,不开 issue。
      - name: Run intel check
        id: intel
        run: |
          cd skills/seo-suite
          set +e
          python3 scripts/intel_check.py check > "$RUNNER_TEMP/intel-report.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/intel-report.txt"
          if [ "$rc" -eq 0 ]; then
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ] && grep -q '^\[CHANGED\]' "$RUNNER_TEMP/intel-report.txt"; then
            echo "result=changed" >> "$GITHUB_OUTPUT"
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
            echo "::error::intel_check 异常退出(rc=$rc,输出里没有 [CHANGED] 行)——本轮不开 issue,见上方输出"
          fi
        continue-on-error: true

      # 状态 commit-back(审计③):check 每轮 save_state(checked_at 必更新)→
      # 无条件 copy-out+diff 提交,与 changed 无关。桥接原因:脚本 STATE_FILE 固定
      # 在 skills/seo-suite/.intel-state.json(.gitignore 排除且无 --state 参数,
      # 禁改脚本),git 权威副本放 .github/state/intel-state.json(不匹配 ignore
      # 的 .intel-state.json 模式——该模式要求点前缀文件名)。每日一个小 commit,
      # 同 monitor.db 模式。
      - name: Persist intel state (copy-out → .github/state/, commit-back)
        run: |
          if [ ! -f skills/seo-suite/.intel-state.json ]; then
            echo "::warning::脚本状态文件未生成(check 未跑成?)——无物可提交"
            exit 0
          fi
          mkdir -p .github/state
          cp skills/seo-suite/.intel-state.json .github/state/intel-state.json
          git config user.name "seo-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/state/intel-state.json
          if git diff --cached --quiet; then
            echo "intel state 无变化,不提交"
          else
            git commit -m "chore(intel): state update [skip ci]"
            if ! git push; then
              echo "::warning::state push 冲突(并发提交)——pull --rebase 后重试一次"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              git push || echo "::warning::重试后仍失败(下轮 run 以 git 基线继续)"
            fi
          fi

      # 工单 = 头部 + 上面唯一一次 check 的报告;只写 $RUNNER_TEMP 和 Actions Summary,不入库
      - name: Build update task (report from the single check above)
        if: steps.intel.outputs.result == 'changed'
        run: |
          {
            echo "# Intel Update Task (auto-generated)"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%MZ) · run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "intel_check.py detected source changes."
            echo "Follow \`skills/seo-suite/references/overview/self-update-protocol.md\` to update the skill."
            echo
            echo "## Changed sources"
            echo
            echo '```'
            cat "$RUNNER_TEMP/intel-report.txt"
            echo '```'
          } > "$RUNNER_TEMP/intel-update-task.md"
          cat "$RUNNER_TEMP/intel-update-task.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue or append task as comment
        if: steps.intel.outputs.result == 'changed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/intel-update-task.md`, 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'intel-update-pending',
              state: 'open'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📚 Intel sources changed — skill update needed',
                body,
                labels: ['intel-update-pending']
              });
            } else {
              // 已有未处理工单:追加本轮报告,处理方按评论逐轮处理完再关单
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
            }

      - name: Notify (optional)
        if: steps.intel.outputs.result == 'changed' && env.SEO_INTEL_SLACK_WEBHOOK
        env:
          SEO_INTEL_SLACK_WEBHOOK: ${{ secrets.SEO_INTEL_SLACK_WEBHOOK }}
        run: |
          curl -s -X POST "$SEO_INTEL_SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"text":"📚 SEO skill intel-update: sources changed. See the open intel-update-pending issue."}' || true

      # ── R0-9:intel issue 无超时升级 ─────────────────────────────────────────
      # job 末步:列出 label=intel-update-pending 且 open 超 72h 的 issue →
      # ::warning(Actions Summary/日志可见)。保守策略:只告警不自动关——
      # "pending 超 72h"可能意味着任务文件没被处理,关掉会掩盖问题;
      # if: always() 保证上游步骤(push 失败等)红了也照常巡检。
      - name: Flag stale intel issues (>72h pending → ::warning;不自动关)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'intel-update-pending',
              state: 'open'
            });
            const cutoff = Date.now() - 72 * 3600 * 1000;
            let stale = 0;
            for (const i of issues) {
              const created = Date.parse(i.created_at);
              if (Number.isFinite(created) && created < cutoff) {
                const hours = Math.round((Date.now() - created) / 3600000);
                core.warning(`intel-update issue #${i.number} 待处理已 ${hours}h(>72h):${i.title} —— 按 self-update-protocol.md 处理或手动关闭(保守策略:不自动关)`);
                stale++;
              }
            }
            if (stale === 0) {
              core.info(issues.length === 0
                ? '无 intel-update-pending issue'
                : `intel-update-pending issue ${issues.length} 张,均未超 72h`);
            }

  # ── capability-drift(CAPABILITY_MATRIX ↔ 文件系统漂移门;零 secret 零网络)────
  # 与 check-and-flag 同一 cron 触发(每日 UTC 01:11 之后串行:needs + !cancelled(),
  # 前者成败都不拦本检查——漂移门独立于信源抓取,不因抓取失败而静默)。跑
  # python3 skills/seo-suite/tests/test_capability_matrix.py:矩阵与 scripts/、
  # templates/ 漂移(典型:新增脚本未登记 CAPABILITY_MATRIX)→ 测试非零退出 →
  # job 红,并上传 diff 说明 artifact(双向差集 + 修复指引);无漂移 → 全绿静默。
  #
  # Continue-on-error 策略(明确声明):漂移必须响亮——本 job 不加 continue-on-error,
  # 失败即红;它是 check-and-flag 的下游 job,自身成败不影响已跑完的信源检查,
  # 与其互不写库互不通知(不 commit、不开 issue——修复由人/agent 按
  # CAPABILITY_MATRIX.md 维护规则执行,self_check 全绿后提交)。
  #
  # secrets/变量:本 job 零依赖(缺省即全功能,不存在需跳过的场景)。
  # 本地等价命令(仓库根):
  #   python3 skills/seo-suite/tests/test_capability_matrix.py
  #   python3 skills/seo-suite/scripts/freshness.py --fail-stale skills/seo-suite/references
  capability-drift:
    needs: check-and-flag          # 在现有 cron job 之后(同一 schedule)
    if: ${{ !cancelled() }}        # 前序 job 取消/失败也照跑(漂移检查不静默)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # 覆盖 workflow 级 contents:write——只读检查+上传说明,最小权限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # unittest 漂移即非零退出 → 步骤红(job 随之红);stdout/stderr 落 log 供 artifact
      - name: Run capability matrix drift test (漂移即失败)
        id: matrix
        run: |
          set +e
          python3 skills/seo-suite/tests/test_capability_matrix.py 2>&1 | tee matrix-drift.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # ── R0-10:freshness 无 CI 守护 → 顺带跑 --fail-stale ──────────────────────
      # 已读 freshness.py --help 确认:--fail-stale flag 存在(stale>0 → exit 1),
      # 无需退出码包装。stale 即红(与漂移门同一响亮纪律);!cancelled() 保证
      # 漂移测试红了本检查也照跑——两个独立缺口一次 run 全部浮出。
      # 注:dir 必须显式传(脚本默认扫 cwd 的 references/,CI cwd 是仓库根)。
      - name: freshness --fail-stale (R0-10:references 证据保鲜 CI 守护)
        if: ${{ !cancelled() }}
        run: |
          set +e
          python3 skills/seo-suite/scripts/freshness.py --fail-stale skills/seo-suite/references
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::references 存在 >90 天 stale 证据(freshness --fail-stale)——复核后回写头部 Updated/复核 日期(详见上方清单)"
          fi
          exit "$rc"

      - name: Explain drift diff (job 已红;给出可操作的双向差集)
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, json, os

          BASE = "skills/seo-suite"
          data = json.load(open(os.path.join(BASE, "data", "capability-matrix.json"), encoding="utf-8"))
          entries = data["entries"]
          listed_scripts = {e["script"] for e in entries if e.get("type") == "script"}
          disk_scripts = {f for f in os.listdir(os.path.join(BASE, "scripts"))
                          if f.endswith(".py") and f != "__pycache__"}
          listed_tpl = {e["path"] for e in entries if e.get("type") == "template"}
          disk_tpl = {os.path.relpath(p, BASE).replace(os.sep, "/")
                      for p in glob.glob(os.path.join(BASE, "templates", "**", "*.md"),
                                         recursive=True)}

          lines = [
              "# CAPABILITY_MATRIX 漂移说明(自动生成)", "",
              "test_capability_matrix.py 失败:矩阵与文件系统不一致。",
              "最常见原因:**新增脚本未登记 CAPABILITY_MATRIX**。", "",
              "## scripts/ 双向差集",
              "- 磁盘有、矩阵无(须同步登记 `data/capability-matrix.json` 与 "
              "`CAPABILITY_MATRIX.md`,含 tests_file/summary 计数): %s"
              % (sorted(disk_scripts - listed_scripts) or "无"),
              "- 矩阵有、磁盘无(脚本被删/改名未同步矩阵): %s"
              % (sorted(listed_scripts - disk_scripts) or "无"),
              "",
              "## templates/ 双向差集",
              "- 磁盘有、矩阵无: %s" % (sorted(disk_tpl - listed_tpl) or "无"),
              "- 矩阵有、磁盘无: %s" % (sorted(listed_tpl - disk_tpl) or "无"),
              "",
              "修复:按 CAPABILITY_MATRIX.md 维护规则补登记(summary 计数与 tests_file "
              "字段须同步改);改完 self_check 全绿再提交。完整失败明细见 matrix-drift.log。",
          ]
          with open("CAPABILITY_DRIFT.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload drift explanation artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capability-drift-explanation
          path: |
            CAPABILITY_DRIFT.md
            matrix-drift.log
          if-no-files-found: error
